services:
  postgres:
    image: postgres:16-alpine
    container_name: balancevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: balancevault
      POSTGRES_PASSWORD: balancevault_dev_password
      POSTGRES_DB: balancevault
    ports:
      - "5432:5432"
    volumes:
      - balancevault_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancevault -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  balancevault_data:
